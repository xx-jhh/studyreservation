<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>스터디카페 좌석 예약</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="page">
        <nav class="nav">
            <a class="brand" th:href="@{/}">스터디카페 예약</a>
            <div class="nav-center">
                <a sec:authorize="isAuthenticated()" class="btn btn-outline" th:href="@{/rooms}">좌석 조회</a>
                <a sec:authorize="isAuthenticated()" class="btn btn-outline" th:href="@{/reservations/me}">내 예약</a>
                <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline" th:href="@{/admin/rooms}">룸 관리</a>
                <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline" th:href="@{/admin/seats}">좌석 관리</a>
                <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline" th:href="@{/admin/reservations}">전체 예약 현황</a>
            </div>
            <div class="nav-links">
                <a sec:authorize="!isAuthenticated()" class="btn btn-outline" th:href="@{/login}">로그인</a>
                <a sec:authorize="!isAuthenticated()" class="btn btn-primary" th:href="@{/signup}">회원가입</a>
                <form sec:authorize="isAuthenticated()" class="inline" th:action="@{/logout}" method="post">
                    <button class="btn btn-outline" type="submit">로그아웃</button>
                </form>
            </div>
        </nav>

        <main class="main">
            <section class="hero">
                <div sec:authorize="!isAuthenticated()">
                    <h1>스터디카페 좌석 예약</h1>
                    <p class="subtitle">원하는 날짜와 시간에 좌석을 예약하고,<br>내 예약을 손쉽게 관리하세요.</p>
                    <div class="hero-actions">
                        <a class="btn btn-primary" th:href="@{/signup}">회원가입</a>
                        <a class="btn btn-outline" th:href="@{/login}">로그인</a>
                    </div>
                </div>
                <div sec:authorize="isAuthenticated()">
                    <h1><span class="welcome-name" sec:authentication="principal.name">사용자</span>님, 환영합니다</h1>
                    <p class="subtitle">오늘도 편안한 학습 공간을 찾아보세요.</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
