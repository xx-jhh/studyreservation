<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>전체 예약 현황</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div class="page-header">
            <div>
                <h1 class="page-title">전체 예약 현황</h1>
                <p class="page-subtitle">전체 사용자의 예약 내역입니다.</p>
            </div>
        </div>

        <div class="card-list" th:if="${!#lists.isEmpty(reservations)}">
            <div class="card-item" th:each="reservation : ${reservations}">
                <div>
                    <div class="title" th:text="${reservation.roomName} + ' · ' + ${reservation.seatNumber} + '번 좌석'">룸 · 좌석</div>
                    <div class="meta" th:text="${reservation.reservationDate} + ' ' + ${reservation.startTime} + ' ~ ' + ${reservation.endTime}">날짜 시간</div>
                    <div class="meta" th:text="${reservation.userName} + ' (' + ${reservation.userEmail} + ')'">예약자</div>
                </div>
            </div>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(reservations)}">
            <div class="empty-icon">◷</div>
            <p>예약 내역이 없습니다.</p>
        </div>
    </div>
</body>
</html>
