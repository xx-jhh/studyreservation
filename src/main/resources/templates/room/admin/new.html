<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>룸 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <h1 class="page-title">룸 등록</h1>

        <form th:action="@{/admin/rooms}" th:object="${roomRegisterRequest}" method="post">
            <div class="form-group">
                <label for="name">룸 이름</label>
                <input type="text" id="name" th:field="*{name}">
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>
            <div class="form-group">
                <label for="description">설명</label>
                <input type="text" id="description" th:field="*{description}">
                <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>
            <div class="form-group">
                <label for="capacity">수용 인원</label>
                <input type="number" id="capacity" th:field="*{capacity}" min="1">
                <p class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p>
            </div>
            <button class="btn btn-primary" type="submit">등록</button>
        </form>
    </div>
</body>
</html>
